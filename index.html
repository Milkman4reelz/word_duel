<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Duel</title><style> *{box-sizing:border-box}body{background:#101525;color:#f5f7ff;font:17px system-ui;margin:auto;max-width:760px;padding:24px}h1{font-size:46px;color:#9df779;margin:0}section{background:#1e2940;border-radius:18px;padding:22px;margin:18px 0}button,input,textarea{font:inherit;border-radius:9px;padding:12px;border:0;margin:4px}button{background:#9df779;color:#14221a;font-weight:bold;cursor:pointer}button:disabled{background:#3b465b;color:#aab4c4;cursor:default}input,textarea{background:#101525;color:white;border:1px solid #62718a;max-width:100%}textarea{width:100%;height:150px}.word{font: bold 24px monospace;letter-spacing:5px;overflow-wrap:anywhere;margin:16px 0}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.keys button{padding:10px 0;margin:0}#error{color:#ffadad}small{color:#b9c7df}</style><h1>WORD DUEL</h1><small>Two players. Secret words. One letter at a time.</small><section id="lobby"><input id="name" placeholder="Your nickname" maxlength="30"><button onclick="act('create',{name:el('name').value})">Create room</button><p>Or join a friend</p><input id="code" placeholder="Room code" maxlength="6"><button onclick="act('join',{code:el('code').value.trim().toUpperCase(),name:el('name').value})">Join</button></section><section id="game" hidden><div id="info"></div><div id="setup" hidden><p>Enter 1–20 secret words or phrases, one per line. Optional hint: BASEBALL | A sport.</p><textarea id="words"></textarea><input id="category" placeholder="Optional category"><p>Timer <select id="seconds"><option value="0">Unlimited</option><option value="60">1 minute</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select> Wrong guesses <select id="limit"><option value="0">Unlimited</option><option>5</option><option>10</option><option>15</option></select></p><button onclick="act('start',{words:el('words').value,category:el('category').value,seconds:el('seconds').value,limit:el('limit').value})">Start round</button></div><p id="score"></p><p id="clock"></p><div id="board"></div><p id="stats"></p><div class="keys" id="keys"></div><button id="next" hidden onclick="act('next')">Switch roles</button><button onclick="sessionStorage.removeItem('duel');location.reload()">Leave room</button></section><section id="chatbox" hidden><b>Room chat</b><div id="chatlog" style="max-height:180px;overflow:auto"></div><input id="message" maxlength="250" placeholder="Message"><button onclick="act('chat',{message:el('message').value});el('message').value=''">Send</button><label><input id="sound" type="checkbox">Sound</label></section><p id="error" role="alert"></p><script>let s=JSON.parse(sessionStorage.getItem('duel')||'null'),busy=false;const el=id=>document.getElementById(id);async function act(action,extra={}){if(busy)return;busy=true;try{let response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...s,action,...extra})}),d=await response.json();if(d.error)throw Error(d.error);s={code:d.code,id:d.id};sessionStorage.setItem('duel',JSON.stringify(s));render(d);el('error').textContent=''}catch(e){el('error').textContent=e.message}finally{busy=false}}let lastResult="",lastGuess=0;function beep(){if(!el("sound").checked)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.07;o.start();o.stop(a.currentTime+.15);o.onended=()=>a.close()}catch{}}function render(d){el("chatbox").hidden=false;el("score").textContent=d.names.map((n,i)=>n+": "+d.scores[i]).join(" | ");el("clock").textContent=(d.category?"Category: "+d.category+" • ":"")+(d.remaining===null?"No timer":d.remaining+" seconds left");el("chatlog").replaceChildren(...d.chat.map(c=>{let p=document.createElement("p");p.textContent=c.name+": "+c.msg;return p}));if(d.guesses.length>lastGuess||d.result&&d.result!==lastResult)beep();if(d.result&&d.result!==lastResult)el("board").animate([{opacity:.3,transform:"scale(.97)"},{opacity:1,transform:"scale(1)"}],{duration:600});lastResult=d.result;lastGuess=d.guesses.length;el('lobby').hidden=true;el('game').hidden=false;let host=d.player===d.host;el('info').textContent='Room '+d.code+' • '+(d.count<2?'Waiting for friend':host?'You are the word maker':'You are the guesser')+' • Round '+(d.round||1);el('setup').hidden=!host||d.count<2||d.words.length>0;el('board').replaceChildren(...d.words.map(w=>{let p=document.createElement('div');p.className='word';p.textContent=(w.solved?"✓ ":"")+w.text; if(w.hint){let h=document.createElement("small");h.style.display="block";h.style.letterSpacing="normal";h.textContent="Hint: "+w.hint;p.append(h)}return p}));el('stats').textContent=d.words.length?(d.done?d.result+' • ':'')+'Incorrect guesses: '+d.misses+(d.limit?'/'+d.limit:'')+' • Letters tried: '+d.guesses.join(' '):'';el('keys').replaceChildren();if(!host&&d.words.length&&!d.done)for(let l of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){let b=document.createElement('button');b.textContent=l;b.disabled=d.guesses.includes(l);b.onclick=()=>act('guess',{letter:l});el('keys').append(b)}el('next').hidden=!d.done}setInterval(()=>{if(s)act('state')},1200);if(s)act('state');</script></html>
